# FlatCAM Plus MCP: keep this fork in sync with upstream FlatCAM Plus and build a Windows release.
#
# Weekly (and on demand) it:
#   1. merges thebestgoodguy/FlatCAM-Plus main into the MCP branch (opens an issue on merge conflicts),
#   2. builds FlatCAM Plus + FlatCAMPlusMCP.exe with PyInstaller on Windows,
#   3. runs the MCP smoke test against the built exe (open Gerber, isolation, milling + laser jobs, G-code),
#   4. builds the Inno Setup installer,
#   5. pushes the merge to the MCP branch and creates a DRAFT release with the installer.
# Publishing the draft release is left to the maintainer. Any failure opens an issue.

name: Sync upstream and build release

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build a draft release even if upstream has no new commits"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mcp-sync-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: thebestgoodguy/FlatCAM-Plus
  UPSTREAM_BRANCH: main
  MCP_BRANCH: feature/flatcam-plus-mcp
  PYTHON_VERSION: "3.12"

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      version: ${{ steps.merge.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MCP_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          upstream_sha=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Upstream has no new commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits:"
            git log --oneline "HEAD..upstream/${UPSTREAM_BRANCH}"
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}" -m "Merge upstream ${UPSTREAM_REPO}@${upstream_sha::7}"; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
              git merge --abort
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                --title "Upstream merge conflict (${upstream_sha::7})" \
                --body "$(printf 'Merging %s@%s into `%s` has conflicts in:\n\n%s\n\nResolve the merge locally and push, then re-run the workflow.\n\nRun: %s/%s/actions/runs/%s' \
                  "${UPSTREAM_REPO}" "${upstream_sha::7}" "${MCP_BRANCH}" "${files}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
              echo "::error::Merge conflict with upstream"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # keep the merge on a staging branch until the build and smoke test pass
            git push --force origin "HEAD:refs/heads/mcp-sync-staging"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' appVersion.py | head -1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build == true
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.changed == 'true' && 'mcp-sync-staging' || env.MCP_BRANCH }}

      - name: Verify checked-out commit
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne "${{ needs.sync.outputs.sha }}") { throw "Expected ${{ needs.sync.outputs.sha }}, got $head" }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          # GDAL has no pip wheel for Windows and is not used by the app
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*gdal\b' } | Set-Content requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r mcp_server/requirements.txt pyinstaller

      - name: Build FlatCAM Plus (PyInstaller)
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          ./packaging/windows/build_windows_installer.ps1 -Target x64 -PythonX64 $py -SkipInstaller

      - name: Build FlatCAMPlusMCP.exe
        shell: pwsh
        run: |
          python -m PyInstaller mcp_server/server.py --name FlatCAMPlusMCP --onefile --console --noconfirm `
            --distpath build/mcp/dist --workpath build/mcp/work --specpath build/mcp `
            --collect-submodules mcp.server --collect-submodules mcp_types --copy-metadata mcp
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for FlatCAMPlusMCP" }
          Copy-Item build/mcp/dist/FlatCAMPlusMCP.exe dist/windows/x64/FlatCAMPlus/ -Force

      - name: Smoke test (MCP -> FlatCAMPlus.exe)
        shell: pwsh
        run: |
          python mcp_server/tests/smoke_test.py dist/windows/x64/FlatCAMPlus/FlatCAMPlusMCP.exe `
            --gerber assets/examples/files/test.gbr --out build/smoke --headless --timeout 900
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          $py = (Get-Command python).Source
          ./packaging/windows/build_windows_installer.ps1 -Target x64 -PythonX64 $py -SkipPyInstaller
          $src = Get-ChildItem dist/installer -Filter "FlatCAMPlus-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $src) { throw "Installer not found" }
          $name = "FlatCAMPlus-MCP-Setup-${{ needs.sync.outputs.version }}-x64.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $src.FullName "release/$name"
          (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline release/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-output
          path: build/smoke/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MCP_BRANCH }}
          fetch-depth: 0

      - name: Fast-forward MCP branch to the tested merge
        if: needs.sync.outputs.changed == 'true'
        run: |
          git fetch origin mcp-sync-staging
          git merge --ff-only "${{ needs.sync.outputs.sha }}"
          git push origin "HEAD:refs/heads/${MCP_BRANCH}"
          git push origin --delete mcp-sync-staging || true

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.sync.outputs.version }}"
          sha="${{ needs.sync.outputs.sha }}"
          up="${{ needs.sync.outputs.upstream_sha }}"
          installer=$(ls release/*.exe | head -1)
          name=$(basename "$installer")
          # next number after the highest existing v<version>-mcp.N (releases, drafts and tags), never reusing
          # the number of a deleted release
          last=$( { gh release list --limit 200 --json tagName --jq '.[].tagName'; git tag --list; } \
                  | sed -n "s/^v${version//./\\.}-mcp\.\([0-9]\+\)$/\1/p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          tag="v${version}-mcp.${n}"
          echo "Release tag: ${tag}"
          sed -e "s/{VERSION}/${version}/g" -e "s/{INSTALLER}/${name}/g" \
              -e "s/{SHA256}/$(cat release/sha256.txt)/g" \
              -e "s/{UPSTREAM_SHA}/${up}/g" -e "s/{UPSTREAM_SHORT}/${up::7}/g" -e "s/{MCP_SHORT}/${sha::7}/g" \
              packaging/mcp/release_notes_template.md > notes.md
          gh release create "$tag" "$installer" --draft --target "$sha" \
            --title "FlatCAM Plus ${version} + FlatCAM Plus MCP (Windows x64)" --notes-file notes.md
          echo "Draft release ${tag} created: review and publish it on the Releases page." >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [sync, build, publish]
    # a merge conflict already opened its own issue in the sync job
    if: failure() && needs.sync.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Sync/build workflow failed ($(date -u +%Y-%m-%d))" \
            --body "The upstream sync / build / smoke test workflow failed. Nothing was pushed to the MCP branch and no release was created. Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
